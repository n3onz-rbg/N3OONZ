<html>
  <head>
    <title>PACER - Anonoteer Switch & Navigation Demo</title>
    <style>
      .anonoteer {
        display: none;
      }
      .anonoteer-mode .normal {
        display: none;
      }
      .anonoteer-mode .anonoteer {
        display: block;
      }
      .content-set {
        display: none;
      }
      .content-set.active {
        display: block;
      }
      button {
        margin: 5px;
      }
    </style>
  </head>
  <body>

    <button onclick="prevSet()">Back</button>
    <button onclick="nextSet()">Next</button>
    
    <!-- Normal Mode Content Sets -->
    <div class="normal">
      <div class="content-set active" id="set0">
        <h2>Set 1</h2>
        <p>This is the first normal mode text.</p>
        <img src="https://placekitten.com/200/200" alt="Kitten 1" />
      </div>
      <div class="content-set" id="set1">
        <h2>Set 2</h2>
        <p>This is the second normal mode text.</p>
        <img src="https://placekitten.com/201/201" alt="Kitten 2" />
      </div>
      <div class="content-set" id="set2">
        <h2>Set 3</h2>
        <p>This is the third normal mode text.</p>
        <img src="https://placekitten.com/202/202" alt="Kitten 3" />
      </div>
    </div>
    
    <!-- Anonoteer Mode Content Sets -->
    <div class="anonoteer">
      <div class="content-set active" id="anonset0">
        <h2>Anon 1</h2>
        <p>Anonoteer: First Set</p>
        <img src="https://placehold.co/200x200?text=anon1" alt="Anon 1" />
      </div>
      <div class="content-set" id="anonset1">
        <h2>Anon 2</h2>
        <p>Anonoteer: Second Set</p>
        <img src="https://placehold.co/201x201?text=anon2" alt="Anon 2" />
      </div>
      <div class="content-set" id="anonset2">
        <h2>Anon 3</h2>
        <p>Anonoteer: Third Set</p>
        <img src="https://placehold.co/202x202?text=anon3" alt="Anon 3" />
      </div>
    </div>
    
    <script>
      let currentSet = 0;
      const totalSets = 3;
      
      function showSet(n) {
        // Normal mode
        document.querySelectorAll('.normal .content-set').forEach((el, idx) => {
          el.classList.toggle('active', idx === n);
        });
        // Anonoteer mode
        document.querySelectorAll('.anonoteer .content-set').forEach((el, idx) => {
          el.classList.toggle('active', idx === n);
        });
      }
      function nextSet() {
        currentSet = (currentSet + 1) % totalSets;
        showSet(currentSet);
      }
      function prevSet() {
        currentSet = (currentSet - 1 + totalSets) % totalSets;
        showSet(currentSet);
      }
      function toggleAnonoteer() {
        document.body.classList.toggle('anonoteer-mode');
        const btn = document.getElementById('anonoteerBtn');
        btn.textContent =
          document.body.classList.contains('anonoteer-mode')
            ? 'Switch Back'
            : 'Switch to Anonoteer';
        // Refresh displayed content set after mode switch
        showSet(currentSet);
      }
      // Initial display
      showSet(currentSet);
    </script>
  </body>
</html>
