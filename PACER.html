<html>
  <html>

  <head>
    <link rel="stylesheet" href="styles.css">
    <title>PACER</title>
    <style>
      .anonoteer {
        display: none;
      }
      .anonoteer-mode .normal {
        display: none;
      }
      .anonoteer-mode .anonoteer {
        display: block;
      }
      .content-set {
        display: none;
      }
      .content-set.active {
        display: block;
      }
      button {
        margin: 5px;
      }
       height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
      }
      .center-container {
        text-align: center;
      }
      .center-container img {
        display: block;
        margin: 20px auto 0 auto; /* adds space above image, centered */
      }
      a {
        color: #eb3489;           /* normal link color */
      }
      a:visited {
        color: #00eaff;           /* visited link color */
      }
      a:hover {
        color: #34ebc0;           /* color when hovered */
      }
      a:active {
        color: #ebc134;           /* color when clicking */
      }
    </style>
  </head>
  <body>

    <button onclick="prevSet()">Back</button>
    <button onclick="nextSet()">Next</button>
    
    <!-- Normal Mode Content Sets -->
    <div class="normal">
      <div class="content-set active" class="center-container" id="set0">
        <h2>devlog1</h2>
        <p>main menu YAYA</p>
        <img src="mainn.png"/>
      </div>
    
    <!-- Anonoteer Mode Content Sets -->
    <div class="anonoteer">
      <div class="content-set active" id="anonset0">
        <h2>Anon 1</h2>
        <p>Anonoteer: First Set</p>
        <img src="https://placehold.co/200x200?text=anon1" alt="Anon 1" />
      </div>
      <div class="content-set" id="anonset1">
        <h2>Anon 2</h2>
        <p>Anonoteer: Second Set</p>
        <img src="https://placehold.co/201x201?text=anon2" alt="Anon 2" />
      </div>
      <div class="content-set" id="anonset2">
        <h2>Anon 3</h2>
        <p>Anonoteer: Third Set</p>
        <img src="https://placehold.co/202x202?text=anon3" alt="Anon 3" />
      </div>
    </div>
    
    <script>
      let currentSet = 0;
      const totalSets = 3;
      
      function showSet(n) {
        // Normal mode
        document.querySelectorAll('.normal .content-set').forEach((el, idx) => {
          el.classList.toggle('active', idx === n);
        });
        // Anonoteer mode
        document.querySelectorAll('.anonoteer .content-set').forEach((el, idx) => {
          el.classList.toggle('active', idx === n);
        });
      }
      function nextSet() {
        currentSet = (currentSet + 1) % totalSets;
        showSet(currentSet);
      }
      function prevSet() {
        currentSet = (currentSet - 1 + totalSets) % totalSets;
        showSet(currentSet);
      }
      function toggleAnonoteer() {
        document.body.classList.toggle('anonoteer-mode');
        const btn = document.getElementById('anonoteerBtn');
        btn.textContent =
          document.body.classList.contains('anonoteer-mode')
            ? 'Switch Back'
            : 'Switch to Anonoteer';
        // Refresh displayed content set after mode switch
        showSet(currentSet);
      }
      // Initial display
      showSet(currentSet);
    </script>
  </body>
</html>
