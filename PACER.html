<html>
  <head>
    <title>PACER - Anonoteer Switch & Navigation Demo</title>
    <style>
      .anonoteer {
        display: none;
      }
      .anonoteer-mode .normal {
        display: none;
      }
      .anonoteer-mode .anonoteer {
        display: block;
      }
      .content-set {
        display: none;
      }
      .content-set.active {
        display: block;
      }
      button {
        margin: 5px;
      }
    </style>
  </head>
  <body>
   
    <button onclick="prevSet()">Back</button>
    <button onclick="nextSet()">Next</button>
    
    <!-- Normal Mode Content Sets -->
    <div class="normal">
      <div class="content-set active" id="set0">
        <h2>Set 1</h2>
        <p>This is the first normal mode text.</p>
        <img src="https://placekitten.com/200/200" alt="Kitten 1" />
      </div>
      <div class="content-set" id="set1">
        <h2>Set 2</h2>
        <p>This is the second normal mode text.</p>
        <img src="https://placekitten.com/201/201" alt="Kitten 2" />
      </div>
      <div class="content-set" id="set2">
        <h2>Set 3</h2>
        <p>This is the third normal mode text.</p>
        <img src="https://placekitten.com/202/202" alt="Kitten 3" />
      </div>
    </div>
   
  </body>
</html>
